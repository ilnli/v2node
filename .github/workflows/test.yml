name: Test and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: python3 -m unittest discover -s tests/deployment -v
      - run: bash -n script/install.sh script/proxynode.sh script/v2node.sh script/package.sh script/download-geodata.sh
      - run: go test ./...
      - run: go test -race ./common/audit ./core/app/dispatcher
      - run: go build -trimpath -o build_assets/proxynode .
